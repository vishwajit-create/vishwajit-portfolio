<div class="contact-form-wrap glass-card reveal-up" style="--delay:0.2s">
            <h3>Send a Message</h3>
            <form id="contact-form">
              <div class="form-row">
                <div class="form-group">
                  <label for="fname">Your Name</label>
                  <input type="text" id="fname" name="name" placeholder="John Doe" required />
                </div>
                <div class="form-group">
                  <label for="femail">Your Email</label>
                  <input type="email" id="femail" name="email" placeholder="john@example.com" required />
                </div>
              </div>
              <div class="form-group">
                <label for="fsubject">Subject</label>
                <input type="text" id="fsubject" name="subject" placeholder="Internship / Collaboration / Hello!" required />
              </div>
              <div class="form-group">
                <label for="fmessage">Message</label>
                <textarea id="fmessage" name="message" rows="4" placeholder="Your message here..." required></textarea>
              </div>
              <input type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;opacity:0;pointer-events:none" />
              <button type="submit" class="btn btn-primary btn-full" id="send-btn">
                <span id="send-text">Send Message 🚀</span>
                <span id="send-spin" class="hidden">Sending...</span>
              </button>
              <div id="form-success" class="success-msg hidden">✅ Message saved! I'll get back to you soon.</div>
            </form>
          </div>
